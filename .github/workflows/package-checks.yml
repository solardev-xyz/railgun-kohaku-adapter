name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.1
          cache: npm
      # The locked better-sqlite3 peer ships N-API prebuilds for these runners.
      # Native test success here does not establish a source build.
      # No Electron, engine, prover or circuit artifact is downloaded here.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: node test/consumer/smoke.mjs
      - run: python3 tools/generate-owner-source-list.py --check
